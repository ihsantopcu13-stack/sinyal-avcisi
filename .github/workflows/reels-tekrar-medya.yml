name: Reels — tekrar turu videoları (yeni tasarım)

# kuyruk.json'daki tekrar konularının (101–140 = konu 1–40) videolarını eski videodan
# yeni tasarıma çevirir ve reels-medya-v1 Release'ine yükler. Var olan dosyaya dokunmaz.
# PR'da yalnız ilk eksik video üretilir ve önizleme olarak eklenir (yükleme yok).

on:
  pull_request:
    paths:
      - automation/reels-yayin/tasarim/**
      - automation/reels-yayin/data/kuyruk.json
      - .github/workflows/reels-tekrar-medya.yml
  push:
    branches: [main]
    paths:
      - automation/reels-yayin/tasarim/**
      - automation/reels-yayin/data/kuyruk.json
      - .github/workflows/reels-tekrar-medya.yml
  workflow_dispatch:

concurrency:
  group: reels-tekrar-medya
  cancel-in-progress: false

jobs:
  medya:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # Release'e video yüklemek için
    defaults:
      run:
        working-directory: automation/reels-yayin/tasarim
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CIKTI_KLASORU: ${{ github.workspace }}/tekrar-cikti
    steps:
      - uses: actions/checkout@v4
      - name: Araçlar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --quiet Pillow
      - name: Üret (PR'da deneme)
        if: github.event_name == 'pull_request'
        run: python3 tekrar_medya.py --dene
      - name: Üret ve yükle
        if: github.event_name != 'pull_request'
        run: python3 tekrar_medya.py
      - name: Önizleme
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tekrar-onizleme
          path: tekrar-cikti/
          if-no-files-found: ignore
