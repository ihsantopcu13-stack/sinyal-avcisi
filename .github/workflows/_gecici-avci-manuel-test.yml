name: GEÇİCİ — AVCI Katmanı Manuel Test (render/yayın YOK)

# Bu workflow SADECE FAZ 1 doğrulaması için var. Cron YOK, sadece elle
# tetiklenir (workflow_dispatch). Sadece scripts/generate-script.mjs'i
# AVCI_OGRETIM_KATMANI=on ile çalıştırır — TTS, render, YouTube/Instagram/
# TikTok yükleme adımları YOK, tamamen dışarıda. Test tamamlanınca bu
# dosya silinecek.

on:
  workflow_dispatch: {}

jobs:
  avci-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/video-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bağımlılıkları kur
        run: npm install

      - name: AVCI öğretim katmanını tek soru için çalıştır (render/yayın YOK)
        env:
          AVCI_OGRETIM_KATMANI: "on"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node -e "
            import('./scripts/generate-script.mjs').then(async (m) => {
              const cikti = await m.scriptUret();
              console.log('=== TAM CIKTI (script.json) ===');
              console.log(JSON.stringify(cikti, null, 2));
            }).catch((err) => { console.error(err); process.exit(1); });
          "

      - name: DUR — render/TTS/yükleme YOK
        run: echo "Script üretimi tamamlandı, pipeline burada kasıtlı olarak duruyor. Video render edilmedi, hiçbir yere yayınlanmadı."
