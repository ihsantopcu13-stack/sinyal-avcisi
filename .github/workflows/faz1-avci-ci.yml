name: FAZ 1 + FAZ 2 — İzole CI (yayın YOK)

# Bu workflow FAZ 1 (AVCI Öğretim Katmanı) ve FAZ 2'nin (attribution,
# deep-link, legacy adapter, input contract) izole birim testlerini
# çalıştırır.
# - Gerçek Anthropic/Instagram/Buffer/Vercel/GA4 çağrısı YOK.
# - TTS, Remotion render, upload script'leri hiç import edilmiyor.
# - GitHub Secrets kullanılmıyor (aşağıda hiç `secrets.` referansı yok).
# - Sadece pull_request (main'e) ve manuel workflow_dispatch ile çalışır
#   — cron/schedule YOK, push tetikleyicisi YOK.
# - contents:read dışında hiçbir izin verilmiyor.
# - Hiçbir test npm bağımlılığı gerektirmiyor (npm install YOK).

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  faz1-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sözdizimi doğrulaması (npm install YOK — bu testler hiçbir npm bağımlılığı gerektirmiyor)
        run: |
          node --check automation/video-pipeline/scripts/avci-ogretim-katmani.mjs
          node --check automation/video-pipeline/scripts/generate-script.mjs
          node --check automation/video-pipeline/scripts/run-pipeline.mjs
          node --check automation/video-pipeline/data/sinyal-kurallari.mjs
          node --check automation/video-pipeline/tests/faz1-ci-test.mjs
          node --check tests/faz2-attribution.test.mjs
          node --check automation/video-pipeline/scripts/_deeplink.mjs
          node --check automation/video-pipeline/tests/faz2-deeplink.test.mjs
          node --check tests/sot-signal-lookup.test.mjs
          node --check tests/faz2-input-contract.test.mjs
          node --check tests/sot-schema.test.mjs
          node --check tests/sot-migration.test.mjs
          node --check scripts/sl-havuz-generator.mjs
          node --check scripts/generate-sl-havuz.mjs
          node --check tests/sot-mirror.test.mjs
          node --check tests/sot-lookup-analytics.test.mjs
          node --check automation/video-pipeline/tests/sot-pipeline.test.mjs
          node --check automation/video-pipeline/scripts/publish-next-marketing-asset.mjs
          node --check automation/video-pipeline/tests/marketing-linkedin-skip.test.mjs
          node --check automation/video-pipeline/scripts/publish-threads.mjs
          node --check automation/video-pipeline/tests/threads-channel-skip.test.mjs
          node --check automation/video-pipeline/scripts/upload-tiktok-buffer.mjs
          node --check automation/video-pipeline/tests/tiktok-channel-skip.test.mjs
          node --check tests/legal-pages.test.mjs
          node --check automation/video-pipeline/scripts/_publication-state.mjs
          node --check automation/video-pipeline/scripts/_publication-manifest.mjs
          node --check automation/video-pipeline/scripts/regenerate-published-content.mjs
          node --check automation/video-pipeline/tests/publication-state.test.mjs
          node --check api/published-content.mjs
          node --check tests/index-html-syntax.test.mjs
          node --check tests/published-content.test.mjs
          node --check tests/answer-history-sync.test.mjs
          node --check tests/answer-history-execution.test.mjs
          node --check tests/anonymous-auth.test.mjs
          node --check tests/avci-zayif-alanlarim.test.mjs
          node --check tests/diagnostic-events-schema.test.mjs
          node --check tests/avci-teshis-koprusu.test.mjs
          node --check tests/avci-kok-neden-motoru.test.mjs
          node --check tests/avci-response-time.test.mjs
          node --check automation/video-pipeline/scripts/_master-publish-meta.mjs
          node --check automation/video-pipeline/scripts/publish-next-master-lesson.mjs
          node --check automation/video-pipeline/scripts/retry-failed-master-publishes.mjs
          node --check automation/video-pipeline/tests/youtube-error-info.test.mjs
          node --check api/mail.mjs
          node --check tests/mail-dryrun.test.mjs
          node --check api/klod.mjs
          node --check tests/avci-klod-auth.test.mjs
          node --check tests/avci-klod-context.test.mjs
          node --check tests/avci-klod-student-context.test.mjs
          node --check tests/avci-klod-teacher-contract.test.mjs
          node --check tests/avci-klod-board-bridge.test.mjs
          node --check tests/avci-klod-lesson-timing.test.mjs
          node --check tests/avci-klod-mini-check.test.mjs
          node --check tests/avci-klod-next-question.test.mjs
          node --check tests/avci-klod-signal-practice.test.mjs
          node --check tests/avci-klod-explicit-reteach.test.mjs
          node --check tests/avci-klod-voice-lite.test.mjs
          node --check tests/avci-turn-controller.test.mjs
          node --check tests/avci-tap-to-interrupt.test.mjs
          node --check tests/avci-turn-handoff-cue.test.mjs
          node --check tests/avci-lesson-closure-summary.test.mjs
          node --check tests/avci-controlled-step-back.test.mjs

      - name: FAZ 1 izole test paketi (ağ çağrısı yok, secret yok, publish yok)
        run: node automation/video-pipeline/tests/faz1-ci-test.mjs

      - name: FAZ 2 — attribution capture testleri
        run: node tests/faz2-attribution.test.mjs

      - name: FAZ 2 — deep-link generator testleri
        run: node automation/video-pipeline/tests/faz2-deeplink.test.mjs

      - name: SOURCE OF TRUTH — stable sinyal lookup testleri (gerçek index.html verisine karşı, eski adı faz2-legacy-adapter)
        run: node tests/sot-signal-lookup.test.mjs

      - name: FAZ 2 — attribution input contract / sanitization testleri
        run: node tests/faz2-input-contract.test.mjs

      - name: SOURCE OF TRUTH — AŞAMA 1 canonical şema + stable ID testleri
        run: node tests/sot-schema.test.mjs

      - name: SOURCE OF TRUTH — AŞAMA 2 59/59 kayıpsız migration testi
        run: node tests/sot-migration.test.mjs

      - name: SOURCE OF TRUTH — AŞAMA 3 frontend generated mirror testi
        run: node tests/sot-mirror.test.mjs

      - name: SOURCE OF TRUTH — AŞAMA 4 stable lookup + analytics testi
        run: node tests/sot-lookup-analytics.test.mjs

      - name: SOURCE OF TRUTH — AŞAMA 5 AVCI/KLOD/video pipeline canonical kaynak testi
        run: node automation/video-pipeline/tests/sot-pipeline.test.mjs

      - name: Pazarlama kuyruğu — LinkedIn kanalı bağlı değilken güvenli SKIP testi
        run: node automation/video-pipeline/tests/marketing-linkedin-skip.test.mjs

      - name: Threads — kanal bağlı değilken güvenli SKIP testi
        run: node automation/video-pipeline/tests/threads-channel-skip.test.mjs

      - name: TikTok — kanal yapılandırılmamışken güvenli SKIP testi
        run: node automation/video-pipeline/tests/tiktok-channel-skip.test.mjs

      - name: OAuth branding — gizlilik/kullanım şartları sayfaları testi
        run: node tests/legal-pages.test.mjs

      - name: Ortak içerik/publication state + public-safe manifest testleri
        run: node automation/video-pipeline/tests/publication-state.test.mjs

      - name: index.html inline script sözdizimi testi (build kontrolü)
        run: node tests/index-html-syntax.test.mjs

      - name: Site + YouTube/Instagram yayın zinciri bağlantısı testi
        run: node tests/published-content.test.mjs

      - name: Öğrenci cevap geçmişi senkron + attribution bağlantısı testi
        run: node tests/answer-history-sync.test.mjs

      - name: Öğrenci cevap geçmişi — gerçek çalıştırma (vm) testi (sahte Supabase client, gerçek ağ yok)
        run: node tests/answer-history-execution.test.mjs

      - name: Anonymous auth — sessiz misafir oturumu gerçek çalıştırma (vm) testi
        run: node tests/anonymous-auth.test.mjs

      - name: AVCI Öğrenme Hafızası — zayıf alan skoru gerçek çalıştırma (vm) testi
        run: node tests/avci-zayif-alanlarim.test.mjs

      - name: AVCI Hata Kökü Motoru (Katman 4) — diagnostic_events şema hazırlığı statik testi (migration ÇALIŞTIRILMADI)
        run: node tests/diagnostic-events-schema.test.mjs

      - name: AVCI Hata Kökü Motoru (Katman 4) — Sinyal Lab teşhis köprüsü gerçek çalıştırma (vm) testi
        run: node tests/avci-teshis-koprusu.test.mjs

      - name: AVCI Hata Kökü Motoru (Katman 4) — kontrollü inference engine gerçek çalıştırma (vm) testi
        run: node tests/avci-kok-neden-motoru.test.mjs

      - name: AVCI Katman 3/4 — response_time_ms ham davranışsal kanıt gerçek çalıştırma (vm) testi
        run: node tests/avci-response-time.test.mjs

      - name: Master-lesson YouTube hata reason/status çıkarımı testi
        run: node automation/video-pipeline/tests/youtube-error-info.test.mjs

      - name: api/mail.mjs mock/dry-run testi (gerçek e-posta gönderilmez)
        run: node tests/mail-dryrun.test.mjs

      - name: KATMAN 5 MVP-1 — KLOD auth foundation testi (gerçek Supabase/Anthropic ağı yok, mock)
        run: node tests/avci-klod-auth.test.mjs

      - name: KATMAN 5B — Sinyal Lab current question context testi (gerçek vm çalıştırma + server mock, gerçek ağ yok)
        run: node tests/avci-klod-context.test.mjs

      - name: KATMAN 5C — server-side student model context testi (client/server parity + server mock, gerçek ağ yok)
        run: node tests/avci-klod-student-context.test.mjs

      - name: KATMAN 5D — AVCI Hoca davranış sözleşmesi + UI/prompt parity testi (gerçek ağ yok)
        run: node tests/avci-klod-teacher-contract.test.mjs

      - name: KATMAN 5E — Akıllı Tahta köprüsü (allowlist board actions, canonical doğrulama, gerçek dispatcher çalıştırma, gerçek ağ yok)
        run: node tests/avci-klod-board-bridge.test.mjs

      - name: KATMAN 5F — canlı ders pedagojik zamanlama sözleşmesi (teacher prompt + tool description tutarlılığı, gerçek ağ yok)
        run: node tests/avci-klod-lesson-timing.test.mjs

      - name: KATMAN 5G — mini kontrol (mini check) sözleşmesi (teacher prompt + 5B/5C/5E regresyon spot-check, gerçek ağ yok)
        run: node tests/avci-klod-mini-check.test.mjs

      - name: KATMAN 5H — canonical next-question deterministic command bridge (gerçek vm çalıştırma, api/klod.mjs değişmedi, gerçek ağ yok)
        run: node tests/avci-klod-next-question.test.mjs

      - name: KATMAN 5I — canonical signal-targeted practice deterministic bridge (gerçek vm çalıştırma, api/klod.mjs değişmedi, gerçek ağ yok)
        run: node tests/avci-klod-signal-practice.test.mjs

      - name: KATMAN 5J — explicit AVCI step reteach sözleşmesi (teacher prompt + 5B/5C/5E regresyon spot-check, gerçek ağ yok)
        run: node tests/avci-klod-explicit-reteach.test.mjs

      - name: KATMAN 5K — AVCI voice-lite (push-to-talk STT + mevcut TTS reuse, gerçek vm çalıştırma, api/klod.mjs değişmedi, gerçek ağ yok)
        run: node tests/avci-klod-voice-lite.test.mjs

      - name: AVCI Turn Controller MVP — ephemeral turn state + re-entrancy guard + Dur butonu (gerçek vm çalıştırma, api/klod.mjs değişmedi, gerçek ağ yok)
        run: node tests/avci-turn-controller.test.mjs

      - name: AVCI Tap-to-Interrupt MVP — SPEAKING sırasında mic ile kesinti (gerçek vm çalıştırma, api/klod.mjs değişmedi, gerçek ağ yok)
        run: node tests/avci-tap-to-interrupt.test.mjs

      - name: AVCI Turn Handoff Cue — mic tooltip ile görsel sıra bildirimi (gerçek vm çalıştırma, api/klod.mjs değişmedi, gerçek ağ yok)
        run: node tests/avci-turn-handoff-cue.test.mjs

      - name: AVCI Lesson Closure Summary — güvenli sohbet özeti prompt sözleşmesi (api/klod.mjs değişmedi, gerçek ağ yok)
        run: node tests/avci-lesson-closure-summary.test.mjs

      - name: AVCI Controlled Step-Back — tekrar hata kontrollü geri adım prompt sözleşmesi (api/klod.mjs değişmedi, gerçek ağ yok)
        run: node tests/avci-controlled-step-back.test.mjs
