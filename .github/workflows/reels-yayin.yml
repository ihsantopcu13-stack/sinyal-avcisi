name: Reels — Instagram, Facebook (Buffer), YouTube Shorts

# Günde bir kez (21:00 TR) çalışır; önündeki yayın saatlerini (bugünün kalanı + yarın;
# 25 Kas 2026'dan itibaren 10:00, 13:30 ve 18:00 İstanbul) sıradaki konularla doldurup Buffer'a TAM O SAAT için zamanlar.
# 10:00 saatine o gün üretilen "3 saniyede çöz" videosu gider (cozum-ekle.mjs).
# GitHub zamanlanmış işleri saatlerce geciktirebildiği için yayın saatini Buffer tutar.
# GÜVENLİK KİLİDİ: zamanlanmış çalışmalar repo değişkeni REELS_YAYIN=acik
# olmadıkça SADECE deneme yapar (hiçbir şey paylaşmaz, bağlantıları test eder).
# Elle çalıştırmada varsayılan mod da "deneme"dir.

on:
  schedule:
    # GitHub cron UTC'dir; Türkiye UTC+3 (yaz saati yok).
    - cron: "0 18 * * *"  # 21:00 TR — ertesi günün 10:00, 13:30 ve 18:00 gönderilerini zamanlar (25 Kas 2026 öncesi: 08:30, 13:00, 17:30)
  workflow_dispatch:
    inputs:
      mod:
        description: "deneme = hiçbir şey paylaşmadan test et · yayinla = gerçekten paylaş"
        type: choice
        options: [deneme, yayinla]
        default: deneme

concurrency:
  group: reels-yayin
  cancel-in-progress: false

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # yayın ilerlemesini (data/durum.json) commit etmek için
    defaults:
      run:
        working-directory: automation/reels-yayin
    env:
      REELS_MOD: ${{ github.event_name == 'workflow_dispatch' && inputs.mod || (vars.REELS_YAYIN == 'acik' && 'yayinla' || 'deneme') }}
      # YouTube yüklemesi yalnız REELS_YOUTUBE=acik iken; kapalıyken konular bekleyen listesinde birikir
      REELS_YOUTUBE: ${{ vars.REELS_YOUTUBE }}
      # Buffer "ilk yorum" ücretli plan özelliği: yalnız BUFFER_ILK_YORUM=acik iken gönderilir
      BUFFER_ILK_YORUM: ${{ vars.BUFFER_ILK_YORUM }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund

      - name: Kuyruğu ve ilerleme kurallarını doğrula
        run: node test/kuyruk.test.mjs && node test/durum.test.mjs && node test/cozum.test.mjs && node test/sinyal.test.mjs

      # Sıradaki konuların Türkçe alt satırlı (tasarim/turkce.py) ve kapaklı (tasarim/kapak.py)
      # videolarını üretip Release'e koyar; yalnız eksik olanlar, üzerine yazmaz. Başarısız olursa
      # yayın eldeki en iyi videoyla sürer (kuyruk-mantigi.mjs → paylasilacakVideo).
      - name: Araçları kur (ffmpeg, Pillow)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --quiet Pillow numpy

      - name: Türkçe alt satırlı videoları hazırla
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tasarim/turkce.py --hepsi --yukle

      - name: Kapaklı videoları hazırla
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tasarim/kapak.py --hepsi --yukle

      # "3 saniyede çöz" günlük videosu (10:00): kuyrukta saati atanmamış bir tane yoksa sıradaki soru
      # için üretir (OpenAI TTS + Remotion), Release'e koyar ve kuyruğa ekler. Yalnız yayinla modunda.
      # Başarısız olursa kuyruk eski hâline döner ve 10:00 saati hazır kuyruktan dolar.
      - name: "3 saniyede çöz: araçları kur"
        id: cozum_kur
        if: env.REELS_MOD == 'yayinla'
        continue-on-error: true
        working-directory: automation/video-pipeline
        run: |
          sudo apt-get install -y -qq \
            libnss3 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2t64 libpango-1.0-0 libpangocairo-1.0-0
          npm install --no-audit --no-fund
          npx remotion browser ensure

      - name: "3 saniyede çöz: yarının videosunu hazırla"
        if: env.REELS_MOD == 'yayinla' && steps.cozum_kur.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if ! (node cozum-ekle.mjs && node test/kuyruk.test.mjs); then
            git checkout -- data/kuyruk.json
            echo "::warning::3 saniyede çöz videosu hazırlanamadı; 10:00 hazır kuyruktan dolacak."
            exit 1
          fi

      # 13:30 "sinyal kelime" günlük videosu: sitedeki sinyal sorularından (assets/data/sinyal-sorular.json)
      # sıradaki için üretir (aynı araçlar ve ses), Release'e koyar ve kuyruğa ekler. Yalnız yayinla modunda.
      # Başarısız olursa kuyruk eski hâline döner ve 13:30 saati hazır kuyruktan dolar.
      - name: "Sinyal kelime: yarının 13:30 videosunu hazırla"
        if: env.REELS_MOD == 'yayinla' && steps.cozum_kur.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cp data/kuyruk.json "$RUNNER_TEMP/kuyruk-yedek.json" # çözüm adımının eklediği kalsın
          if ! (node sinyal-ekle.mjs && node test/kuyruk.test.mjs); then
            cp "$RUNNER_TEMP/kuyruk-yedek.json" data/kuyruk.json
            echo "::warning::Sinyal kelime videosu hazırlanamadı; 13:30 hazır kuyruktan dolacak."
            exit 1
          fi

      - name: "Reels (${{ env.REELS_MOD }})"
        run: node reels-yayin.mjs
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: İlerlemeyi commit'le
        if: always() && env.REELS_MOD == 'yayinla'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/durum.json data/kuyruk.json
          git diff --staged --quiet || git commit -m "chore: reels yayın ilerlemesi [skip ci]"
          git pull --rebase --autostash && git push
