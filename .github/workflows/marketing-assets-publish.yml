name: Pazarlama İçerikleri — Günlük Yayın

on:
  schedule:
    # Her gün 06:00 UTC = 09:00 Türkiye (DST yok) — diğer günlük yayın
    # cron'larıyla (13:00 ve 17:00 UTC) çakışmasın diye önce çalışır.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  publish-next-marketing-asset:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ilerleme state dosyasını (marketing-queue-state.json) commit etmek için
    defaults:
      run:
        working-directory: automation/video-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bağımlılıkları kur
        run: npm install

      - name: Sıradaki pazarlama içeriğini yayınla
        run: node scripts/publish-next-marketing-asset.mjs
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: İlerlemeyi commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/marketing-queue-state.json
          git diff --staged --quiet || git commit -m "chore: pazarlama içerik kuyruğu yayın ilerlemesi güncellendi [skip ci]"
          git push
