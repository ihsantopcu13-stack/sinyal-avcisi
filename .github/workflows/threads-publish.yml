name: Threads — Günlük Sinyal İpucu Yayını

on:
  schedule:
    # Her gün 10:00 UTC = 13:00 Türkiye (DST yok).
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/video-pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bağımlılıkları kur
        run: npm install

      - name: Günün sinyal ipucunu üret
        run: npm run generate-threads-post

      - name: Threads'e yayınla
        run: npm run publish-threads
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}

      - name: Üretilen içerikleri artifact olarak sakla (hata ayıklama için)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threads-out
          path: automation/video-pipeline/out
          retention-days: 7
