name: Reels — yeni konu videoları (nane yeşili şablon)

# tasarim/yeni-konular.json'daki konuların videolarını OpenAI TTS sesiyle üretir.
# PR'da: yalnız konu 68 üretilir ve "reels-onizleme" ön sürümüne konur (onay için).
# main'de: Release'te olmayan videolar üretilir ve reels-medya-v1'e yüklenir (üzerine yazmaz).

on:
  pull_request:
    paths:
      - automation/reels-yayin/tasarim/uret_yeni.py
      - automation/reels-yayin/tasarim/yeni-konular.json
      - .github/workflows/reels-yeni-konular.yml
  push:
    branches: [main]
    paths:
      - automation/reels-yayin/tasarim/uret_yeni.py
      - automation/reels-yayin/tasarim/yeni-konular.json
      - .github/workflows/reels-yeni-konular.yml
  workflow_dispatch:

concurrency:
  group: reels-yeni-konular
  cancel-in-progress: false

jobs:
  medya:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # Release'e video yüklemek için
    defaults:
      run:
        working-directory: automation/reels-yayin/tasarim
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CIKTI_KLASORU: ${{ github.workspace }}/yeni-cikti
    steps:
      - uses: actions/checkout@v4
      - name: Araçlar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --quiet Pillow
      - name: Önizleme (PR)
        if: github.event_name == 'pull_request'
        run: |
          python3 uret_yeni.py --video 68
          gh release view reels-onizleme >/dev/null 2>&1 || \
            gh release create reels-onizleme --prerelease --title "Reels önizleme" --notes "Onay için örnek videolar; yayın hattı kullanmaz."
          gh release upload reels-onizleme "$CIKTI_KLASORU/konu68.mp4" --clobber
      - name: Üret ve yükle
        if: github.event_name != 'pull_request'
        run: python3 uret_yeni.py --hepsi --yukle
